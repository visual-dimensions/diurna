<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090F" />
    <title>Diurna – the world's newspapers on a living globe</title>
    <meta name="description" content="A night-time globe where the world's newsrooms glow. Tap a city and read what its newspapers lead with right now – updated every 30 minutes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diurna – the world's newspapers on a living globe" />
    <meta property="og:description" content="Tap a city and read what its newspapers lead with right now." />
    <style>
      /* Static shell: paints instantly, replaced once the app has loaded. */
      html, body { margin: 0; height: 100%; background: #07090f; color: #f3ebdd; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 400 0.8rem/1.4 system-ui, sans-serif; color: #9aa2b2; letter-spacing: 0.02em; }
      .boot__mark { position: absolute; top: 18px; left: 20px; margin: 0; font: 500 1.05rem Georgia, serif; letter-spacing: 0.32em; color: #f3ebdd; }
      .boot__globe { width: min(62vmin, 520px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #121828, #0b0f18 70%); box-shadow: 0 0 60px rgb(120 160 220 / 0.08); }
      .boot__text { position: absolute; bottom: 28px; margin: 0; }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="boot">
        <p class="boot__mark">DIURNA</p>
        <div class="boot__globe" aria-hidden="true"></div>
        <p class="boot__text">Loading the world’s newsrooms…</p>
      </div>
    </main>
    <noscript><p style="padding:24px">Diurna needs JavaScript for the globe. <a href="/about/">About Diurna</a></p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
