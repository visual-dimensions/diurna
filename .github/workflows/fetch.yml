name: Fetch headlines

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *' # every 30 min, off the busy :00/:30 slots

permissions:
  contents: write

concurrency:
  group: fetch-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the first run converts the translation model (~10 min), later runs take ~2 min
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore translation model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .models/m2m100_1.2B-ct2
          key: m2m100-1.2B-ct2-int8-v1

      - name: Prepare translation model (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare_translation_model.sh

      - name: Install translation runtime
        run: pip install -r scripts/requirements-translate.txt

      - name: Fetch headlines
        run: python scripts/fetch_headlines.py

      - name: Translate new headlines
        continue-on-error: true # without translations the site still works
        run: python scripts/translate_headlines.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "diurna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/headlines.json public/data/status.json data/http_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update headlines"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy from here.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
