name: Fetch headlines

on:
  workflow_dispatch:
  # Enabled in Phase 2, once fetch_headlines.py is implemented:
  # schedule:
  #   - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: fetch-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch headlines
        run: python scripts/fetch_headlines.py

      - name: Commit changes
        run: |
          git config user.name "diurna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/http_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: update headlines"
            git push
          fi
