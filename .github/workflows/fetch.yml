name: Fetch headlines

# Every 30 minutes: restore the pipeline state from the `data` branch, fetch,
# translate, build the frontend data files, and publish them to `data` again
# as a single commit without history (keeps the repository small). Then deploy.

on:
  workflow_dispatch:
    inputs:
      fetch_all:
        description: Fetch every source, ignoring the per-tier cadence
        type: boolean
        default: false
  schedule:
    # Every 10 minutes: GitHub drops many scheduled runs of public repositories under load (in
    # October 2026 only ~3 of 48 per day ran). fetch_headlines.py only fetches sources that are due
    # (cadence by tier), so more triggers don't mean more requests – just fewer gaps.
    - cron: '4,14,24,34,44,54 * * * *'

permissions:
  contents: write

concurrency:
  group: fetch-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the first run converts the translation model (~10 min), later runs take ~2 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements*.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt -r scripts/requirements-translate.txt

      - name: Restore state from the data branch
        run: bash scripts/pull_data.sh

      - name: Restore translation model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .models/m2m100_1.2B-ct2
          key: m2m100-1.2B-ct2-int8-v1

      - name: Prepare translation model (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare_translation_model.sh

      - name: Fetch headlines
        env:
          FETCH_ALL: ${{ inputs.fetch_all && '1' || '0' }}
        run: python scripts/fetch_headlines.py

      - name: Translate new headlines
        continue-on-error: true # without translations the site still works
        run: python scripts/translate_headlines.py

      - name: Build frontend data
        run: python scripts/build_frontend_data.py

      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(mktemp -d)"
          mkdir -p "$out/public" "$out/data"
          cp -r public/data "$out/public/"
          cp data/http_cache.json "$out/data/" 2>/dev/null || true
          cd "$out"
          git init -q -b data
          git config user.name "diurna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy from here.
  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
