name: Deploy

# Builds the site and uploads it to Cloudflare Pages (Direct Upload – no Git
# integration, so the half-hourly data commits do not count against the
# Pages build limit). Runs on code pushes and after every headline fetch.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# without them the deploy step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Get the current data from the data branch
        run: bash scripts/pull_data.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # Cloudflare occasionally fails with "Unknown internal error" – retry before failing the run.
        run: |
          for attempt in 1 2 3; do
            npx wrangler@4 pages deploy dist --project-name=diurna --branch=main --commit-dirty=true && exit 0
            echo "::warning::deploy failed (attempt $attempt), retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets not set – build checked, deploy skipped."
